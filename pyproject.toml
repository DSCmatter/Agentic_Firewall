[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-firewall"
version = "0.1.0"
description = "MCP policy gateway and red-team benchmark harness"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.7",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "websockets>=12.0",
]

[project.scripts]
agentic-firewall = "agentic_firewall.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_firewall*", "benchmarking*", "gateway*", "security*", "toy_server*"]

[tool.setuptools.package-data]
gateway = ["policy_v2.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["src/tests"]
